<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Despensa Virtual</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🛒 Mi Despensa</h1>
        
        <div class="input-section">
            <input type="text" id="itemInput" placeholder="Ej. Arroz, Leche, Café...">
            <button id="addBtn">Agregar</button>
        </div>

        <ul id="itemList">
            <!-- Los productos aparecerán aquí dinámicamente -->
        </ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
<h1><img src="logo.png" alt="Logo" style="width: 40px; height: 40px; vertical-align: middle; margin-right: 10px;"> Despensa en Tiempo Real</h1>
 <link rel="icon" type="image/png" href="logo.png">
<!-- Enlace al manifiesto de aplicación móvil -->
<link rel="manifest" href="manifest.json">

<!-- Soporte de icono nativo para dispositivos iOS / Apple -->
<link rel="apple-touch-icon" href="logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Opción A: Carrito de supermercado como emoji -->
<div class="carrito-compras">🛒 Mi Carrito</div>
 <!-- Copia esto dentro de <head> en tu index.html -->
<link rel="stylesheet" href="https://cloudflare.com">
<!-- Esto dibujará un carrito de compras profesional -->
<button class="btn-carrito"><i class="fa-solid fa-cart-shopping"></i> Ver Carrito</button>
