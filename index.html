<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Despensa</title>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 1.5rem;
    }

    .container { max-width: 480px; margin: 0 auto; }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .input-section {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .input-section input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
    }

    .input-section input:focus { border-color: #4CAF50; }

    .input-section button {
      padding: 0.75rem 1.2rem;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    #itemList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    #itemList li {
      background: white;
      border-radius: 10px;
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .item-nombre {
      font-size: 1rem;
      font-weight: 500;
      flex: 1;
    }

    .item-controles {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-qty {
      width: 2rem;
      height: 2rem;
      border: 2px solid #4CAF50;
      background: white;
      color: #4CAF50;
      border-radius: 6px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      line-height: 1;
    }

    .btn-qty:hover { background: #4CAF50; color: white; }

    .item-cantidad {
      min-width: 2rem;
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛒 Mi Despensa</h1>
    <div class="input-section">
      <input type="text" id="itemInput" placeholder="Ej. Arroz, Leche, Café...">
      <button id="addBtn">Agregar</button>
    </div>
    <ul id="itemList"></ul>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCHfQwXlSVgbLw9iuC8iXYshTtBUJum2RU",
      authDomain: "mi-despenda.firebaseapp.com",
      databaseURL: "https://mi-despenda-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mi-despenda",
      storageBucket: "mi-despenda.firebasestorage.app",
      messagingSenderId: "371223706662",
      appId: "1:371223706662:web:f507e35bb15c676ec67ae7"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const itemsRef = db.ref('items');

    const itemInput = document.getElementById('itemInput');
    const addBtn    = document.getElementById('addBtn');
    const itemList  = document.getElementById('itemList');

    addBtn.addEventListener('click', agregarItem);
    itemInput.addEventListener('keypress', e => {
      if (e.key === 'Enter') agregarItem();
    });

    function agregarItem() {
      const texto = itemInput.value.trim();
      if (!texto) return;
      itemsRef.push({ nombre: texto, cantidad: 1 });
      itemInput.value = '';
      itemInput.focus();
    }

    function cambiarCantidad(key, delta) {
      itemsRef.child(key).once('value', snap => {
        const actual = snap.val().cantidad || 1;
        const nueva = Math.max(0, actual + delta);
        if (nueva === 0) {
          if (confirm('¿Borrar este producto?')) {
            itemsRef.child(key).remove();
          }
        } else {
          itemsRef.child(key).update({ cantidad: nueva });
        }
      });
    }

    itemsRef.on('value', snapshot => {
      itemList.innerHTML = '';
      snapshot.forEach(child => {
        const { nombre, cantidad } = child.val();
        const li = document.createElement('li');
        li.innerHTML = `
          <span class="item-nombre">${nombre}</span>
          <div class="item-controles">
            <button class="btn-qty" onclick="cambiarCantidad('${child.key}', -1)">−</button>
            <span class="item-cantidad">${cantidad || 1}</span>
            <button class="btn-qty" onclick="cambiarCantidad('${child.key}', 1)">+</button>
          </div>
        `;
        itemList.appendChild(li);
      });
    });
  </script>
</body>
</html>
